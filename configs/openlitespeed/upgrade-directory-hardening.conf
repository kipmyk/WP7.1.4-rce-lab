# ==============================================================================
# OpenLiteSpeed (OLS) / LiteSpeed Hardening Configuration
# Target: /wp-content/upgrade/
# ==============================================================================
#
# Context: Virtual Host Configuration File or WebAdmin Console
#
# Operational Rationale:
# OpenLiteSpeed supports both native 'context' configuration blocks and Apache-
# compatible rewrite rules. Placing an explicit inaccessible context ensures
# OLS drops direct HTTP access and refuses to execute PHP handlers.
#
# ==============================================================================

# Option 1: Native OpenLiteSpeed Context Block (Recommended)
# Placed in the VirtualHost configuration file:
# $SERVER_ROOT/conf/vhosts/<vhost_name>/vhconf.conf
context /wp-content/upgrade/ {
  type                    NULL
  location                /var/www/html/wp-content/upgrade/
  allowBrowse             0
  accessible              no
  addDefaultCharset       off
  
  # Deny all external traffic
  rewrite  {
    enable                1
    rules                 <<<END_rules
    RewriteRule ^.*$ - [F,L]
    END_rules
  }
}

# Option 2: Apache-Compatible Rewrite Rule
# Supported in OLS with Rewrite enabled or in root .htaccess:
#
# <IfModule Litespeed>
# RewriteEngine On
# RewriteRule ^wp-content/upgrade/.* - [F,L]
# </IfModule>

