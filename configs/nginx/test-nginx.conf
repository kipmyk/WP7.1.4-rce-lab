events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Hardening Directive under test
        location ^~ /wp-content/upgrade/ {
            deny all;
            return 403 "403 Forbidden: Upgrade directory access denied by server policy.\n";
        }

        # Upstream proxy to test WordPress application
        location / {
            proxy_pass http://wp_vuln_app:80;
            proxy_set_header Host 127.0.0.1:8081;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

