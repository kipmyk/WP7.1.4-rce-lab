# ==============================================================================
# Nginx Hardening Configuration: WordPress Upgrade Directory
# Target: /wp-content/upgrade/
# ==============================================================================
#
# Context: Inside 'server { ... }' block (Preceding general PHP location)
#
# Critical Nginx Precedence Rule:
# By using the prefix match modifier '^~', Nginx will stop searching for regex
# matches if this location matches. This ensures that subsequent regex blocks
# like 'location ~ \.php$' will NEVER be reached for requests targeting
# /wp-content/upgrade/, preventing PHP-FPM execution completely.
#
# ==============================================================================

# Deny all direct HTTP requests to the upgrade directory and its contents
location ^~ /wp-content/upgrade/ {
    # 1. Deny all HTTP methods and clients
    deny all;

    # 2. Prevent directory auto-indexing
    autoindex off;

    # 3. Suppress access logging for probe traffic (optional performance control)
    access_log off;
    log_not_found off;

    # 4. Explicit 403 Forbidden return
    return 403;
}

# Secondary Defense: Defense-in-depth script block (if nested locations are used)
location ~* ^/wp-content/upgrade/.*\.php$ {
    deny all;
    return 403;
}

